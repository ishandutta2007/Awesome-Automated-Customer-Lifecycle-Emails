<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d17"/>
      <stop offset="50%" stop-color="#10172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="accent-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Filters for Glows -->
    <filter id="glow-heavy" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="60" result="blur"/>
    </filter>

    <filter id="glow-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
    </filter>

    <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.7" stroke-opacity="0.3"/>
      <circle cx="40" cy="40" r="1" fill="#64748b" fill-opacity="0.3"/>
    </pattern>

    <style>
      .glow-orb-1 {
        animation: floatOrb1 14s ease-in-out infinite alternate;
      }
      .glow-orb-2 {
        animation: floatOrb2 16s ease-in-out infinite alternate;
      }
      .pulse-line {
        stroke-dasharray: 8 12;
        animation: dashMove 25s linear infinite;
      }
      .node-float {
        animation: floatCard 6s ease-in-out infinite alternate;
      }
      .node-float-rev {
        animation: floatCardRev 7s ease-in-out infinite alternate;
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -1000; }
      }
      @keyframes floatOrb1 {
        0% { transform: translate(0px, 0px) scale(1); }
        50% { transform: translate(80px, 40px) scale(1.15); }
        100% { transform: translate(-40px, 60px) scale(0.95); }
      }
      @keyframes floatOrb2 {
        0% { transform: translate(0px, 0px) scale(1); }
        50% { transform: translate(-60px, -30px) scale(1.2); }
        100% { transform: translate(50px, -50px) scale(0.9); }
      }
      @keyframes floatCard {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-8px); }
      }
      @keyframes floatCardRev {
        0% { transform: translateY(0px); }
        100% { transform: translateY(8px); }
      }
      .text-glow {
        filter: drop-shadow(0 2px 14px rgba(129, 140, 248, 0.45));
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bg-grad)"/>

  <!-- Dynamic Background Glow Orbs -->
  <g filter="url(#glow-heavy)" opacity="0.45">
    <circle class="glow-orb-1" cx="220" cy="140" r="160" fill="url(#accent-cyan)"/>
    <circle class="glow-orb-2" cx="980" cy="260" r="180" fill="url(#accent-purple)"/>
    <circle cx="600" cy="380" r="140" fill="#6366f1" opacity="0.3"/>
  </g>

  <!-- Grid Overlay -->
  <rect width="1200" height="420" rx="16" fill="url(#grid-pattern)"/>

  <!-- Connecting Background Flow Lines -->
  <g class="pulse-line" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.35" fill="none">
    <path d="M 100 80 Q 300 20 600 80 T 1100 80" />
    <path d="M 80 340 Q 400 390 700 330 T 1120 340" />
    <path d="M 180 360 C 280 200, 400 220, 500 120" />
    <path d="M 700 300 C 800 200, 920 220, 1020 120" />
  </g>

  <!-- Dynamic Floating Decorative Tech Badges (Background/Sides) -->
  <g class="node-float" opacity="0.85">
    <!-- Left Lifecycle Step Node -->
    <g transform="translate(60, 200)">
      <rect width="130" height="46" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6" filter="url(#glow-soft)"/>
      <text x="65" y="28" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">⚡ User Signup</text>
    </g>
    <!-- Left Secondary Node -->
    <g transform="translate(90, 275)">
      <rect width="145" height="46" rx="10" fill="#1e293b" stroke="#818cf8" stroke-width="1" stroke-opacity="0.6"/>
      <text x="72" y="28" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">📬 Onboarding Drip</text>
    </g>
  </g>

  <g class="node-float-rev" opacity="0.85">
    <!-- Right Lifecycle Step Node -->
    <g transform="translate(1010, 190)">
      <rect width="135" height="46" rx="10" fill="#1e293b" stroke="#c084fc" stroke-width="1" stroke-opacity="0.6" filter="url(#glow-soft)"/>
      <text x="67" y="28" fill="#e9d5ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🎯 Retention Trigger</text>
    </g>
    <!-- Right Secondary Node -->
    <g transform="translate(970, 265)">
      <rect width="140" height="46" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6"/>
      <text x="70" y="28" fill="#bae6fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">💎 Re-engagement</text>
    </g>
  </g>

  <!-- Central Foreground Content (Title, Subtitle, Badges) -->
  <!-- Top Category Pill -->
  <g transform="translate(470, 48)">
    <rect width="260" height="32" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2"/>
    <circle cx="16" cy="16" r="5" fill="#22c55e"/>
    <text x="138" y="21" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1" text-anchor="middle">CURATED AWESOME STACK</text>
  </g>

  <!-- Main Title -->
  <text class="text-glow" x="600" y="145" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="url(#primary-glow)" letter-spacing="-0.5">
    Automated Customer Lifecycle Emails
  </text>

  <!-- Subtitle -->
  <text x="600" y="195" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#cbd5e1" letter-spacing="0.2">
    Enterprise SaaS &amp; Open-Source Platforms for Retention, Triggered Messaging &amp; Drip Journeys
  </text>

  <!-- Feature Highlights / Pills Row in Foreground -->
  <g transform="translate(230, 235)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="165" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="82" y="22" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle">⚡ Event-Triggered</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(180, 0)">
      <rect width="180" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="90" y="22" fill="#c4b5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle">📬 Drip Automations</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(375, 0)">
      <rect width="175" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="87" y="22" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🔄 Churn Prevention</text>
    </g>
    <!-- Pill 4 -->
    <g transform="translate(565, 0)">
      <rect width="175" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="87" y="22" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🌐 Self-Hosted OSS</text>
    </g>
  </g>

  <!-- Border Frame Accent -->
  <rect x="1" y="1" width="1198" height="418" rx="15" fill="none" stroke="#475569" stroke-width="1" stroke-opacity="0.3"/>
</svg>
